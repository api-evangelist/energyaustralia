source: >-
  Consumer Data Standards 1.36.0 versioning and future-dated-obligations sections, the
  ConsumerDataStandardsAustralia/standards GitHub release history, and live probes of
  the EnergyAustralia CDR brand path on 2026-07-27.
note: >-
  EnergyAustralia publishes no lifecycle policy of its own. The versioning, deprecation
  and retirement policy that binds its CDR surfaces is set by the Data Standards Body
  under the ACCC's Consumer Data Right rules, and the operational-health surface is
  served by the standards' own Discovery endpoints on the EnergyAustralia brand path.
  Every field below records the policy that actually governs this API, with its
  publisher named.
versioning:
  scheme: per-endpoint payload version negotiated by request header
  request_header: x-v
  minimum_header: x-min-v
  uri_family_version: cds-au/v1
  current_standard: '1.36.0'
  standard_published: '2025-12-04'
  publisher: Data Standards Body (DSB)
  docs: https://consumerdatastandardsaustralia.github.io/standards/#versioning
  observed_endpoint_versions:
    listEnergyPlans: '1'
    getEnergyPlanDetail: '3'
    getStatus: '1'
    getOutages: '1'
    getCustomer: '1'
    getCustomerDetail: '2'
    listEnergyAccounts: '2'
    getEnergyAccountDetail: '4'
    listElectricityServicePoints: '2'
    getElectricityServicePointDetail: '2'
    getBillingForEnergyAccount: '3'
    listEnergyAccountBillingBulk: '3'
    listEnergyAccountBillingForSpecificAccounts: '3'
  evidence: >-
    Live version negotiation verified on the public surface: GET
    /energy/plans/ENE831725MRE15@EME returned HTTP 406 "Unsupported Version" at x-v 1
    (min=3) and HTTP 200 at x-v 3 on 2026-07-27. Correct per-endpoint negotiation is
    itself evidence of a conformant implementation rather than a static file.
deprecation:
  policy_url: https://consumerdatastandardsaustralia.github.io/standards/#future-dated-obligations
  publisher: Data Standards Body (DSB)
  provider_published: false
  sunset_header: false
  rfc8594: false
  mechanism: >-
    Endpoint versions are deprecated and retired on published, dated obligations rather
    than by RFC 8594 Sunset/Deprecation response headers. The DSB publishes a
    Future Dated Obligations schedule: a new endpoint version is given a mandatory
    implementation date, and the superseded version may then be retired from a stated
    date (typically no earlier than twelve months after the new version becomes
    binding). Data holders must serve overlapping versions through the transition, which
    is why x-min-v exists.
  example: >-
    Get Generic Plan Detail v2 was retired after v3 became the mandatory version — the
    live EnergyAustralia brand path now refuses x-v 1 on that endpoint and answers at
    x-v 3, matching the published schedule.
  obsolete_versions_index: https://consumerdatastandardsaustralia.github.io/standards/includes/obsolete/
  deprecated_operations: []
  deprecated_operations_note: >-
    No operation in either harvested OpenAPI carries `deprecated: true`; the standards
    remove retired versions from the current document rather than flagging them in place.
