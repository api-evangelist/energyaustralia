sla:
  url: https://consumerdatastandardsaustralia.github.io/standards/#availability-requirements
  publisher: Data Standards Body (DSB)
  provider_published: false
  note: >-
    Availability and performance are set as Non-Functional Requirements in the Consumer
    Data Standards and are obligations on the data holder, not a commercial SLA offered
    by EnergyAustralia to developers. No developer-facing SLA exists because there is no
    developer-facing product.
support:
  developer_support: none
  note: >-
    No developer portal, no developer support channel, no self-serve signup. Consumer
    support is https://www.energyaustralia.com.au/home/help-and-support. Ecosystem
    support for accredited recipients runs through the ACCC CDR service desk and the DSB
    standards-maintenance repository.
  standards_maintenance: https://github.com/ConsumerDataStandardsAustralia/standards-maintenance
retirement_risk:
  surface_hosted_by_third_party: true
  note: >-
    The only publicly reachable EnergyAustralia API surface is hosted by the Australian
    Energy Regulator, not by EnergyAustralia. Its continuity is a function of the AER's
    Energy Made Easy CDR gateway and of the CDR designation for energy, not of any
    EnergyAustralia product decision.
