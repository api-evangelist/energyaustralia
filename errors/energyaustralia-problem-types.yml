source: >-
  Derived from the 4xx responses declared across
  openapi/energyaustralia-cds-energy-api-openapi.yml and
  openapi/energyaustralia-cds-common-api-openapi.yml, then enriched with the normative
  URN codes from the Consumer Data Standards error reference.
docs: https://consumerdatastandardsaustralia.github.io/standards/#error-codes
format: cds-error-list
format_note: >-
  NOT RFC 9457 Problem Details. The CDR Data Standards define their own error envelope:
  a JSON object with a required top-level `errors` array, each element carrying required
  `code` (a URN), `title` and `detail`, plus an optional `meta` object used to carry an
  application-specific error code alongside the standard CDR URN it extends. Media type
  is `application/json`, not `application/problem+json`.
envelope:
  schema: ResponseErrorListV2
  media_type: application/json
  shape:
    errors:
      - code: string (required) — the CDR error code URN, or an application-specific code
        title: string (required) — short human-readable summary, stable per code
        detail: string (required) — human-readable explanation for this occurrence
        meta: object (conditional) — carries `urn` when `code` is application-specific
  correlation_header: x-fapi-interaction-id
  correlation_note: >-
    Every error response echoes or mints an RFC 4122 UUID in the x-fapi-interaction-id
    response header. Verified live on the public surface 2026-07-27.
status_coverage:
  '400': 27 operations
  '404': 10 operations
  '406': 27 operations
  '422': 16 operations
