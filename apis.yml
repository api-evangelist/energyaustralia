notWired:
  note: >-
    Canonical pointers deliberately NOT emitted, with the reason. Recorded so a later
    round does not re-litigate them, and so the absence reads as a finding rather than an
    oversight.
  pointers:
  - type: SDKs
    reason: >-
      No first-party client library exists in any registry. The only libraries that
      target this contract are Data Standards Body ecosystem tooling
      (@cds-au/holder-sdk, @cds-au/testdata), catalogued in packages/ as official:false.
  - type: MCPServer
    reason: >-
      No hosted or remote MCP server exists. mcp/energyaustralia-mcp.yml is a CANDIDATE
      manifest derived one-tool-per-operation from the OpenAPI, with url:null and
      published:false; wiring MCPServer would claim a server that does not exist.
  - type: Idempotency
    reason: >-
      The API defines no idempotency key and needs none — every operation is a read. The
      five POST operations carry id lists in the body and are queries, not mutations.
  - type: Security
    reason: >-
      probe-security-programs.py returned vdp=none. No security.txt on any host, no
      responsible-disclosure page, no bug bounty. The CDR ecosystem has its own
      disclosure policy but that is the regulator's, not EnergyAustralia's.
  - type: Compliance
    reason: >-
      No published certification or compliance program. conformance/ asserts standards
      conformance only, which does not earn a Compliance claim.
  - type: TrustCenter
    reason: probe-security-programs.py returned trust=none.
  - type: WellKnown
    reason: >-
      Every /.well-known/ path on every host returned 404 (or was Akamai-blocked). The
      negative result is recorded in well-known/energyaustralia-well-known.yml.
  - type: SecurityTxt
    reason: No RFC 9116 security.txt on any host.
  - type: AsyncAPI
    reason: >-
      The CDR Energy and Common APIs define no event, streaming or webhook surface. Not a
      gap — the regime is request/response only, so this is N/A rather than missing.
  - type: Webhooks
    reason: No webhook surface exists.
  - type: GitHubOrganization
    reason: >-
      github.com/EnergyAustralia exists but is an unrelated vanity org — no metadata, one
      2019 JavaScript micro-library. Not the gentailer.
  - type: Postman
    reason: >-
      No EnergyAustralia Postman collection or workspace. The DSB publishes an
      ecosystem-wide schema-test workspace, which is not this provider's.
  - type: DeveloperPortal
    reason: >-
      No developer portal exists. developer./developers./docs./data. subdomains are all
      NXDOMAIN; api.energyaustralia.com.au is a closed MuleSoft gateway returning 403.
  - type: GettingStarted
    reason: No quickstart or getting-started page — there is no developer product.
  - type: Blog
    reason: No developer or engineering blog.
  - type: Roadmap
    reason: No public roadmap.
  - type: Sandbox
    reason: >-
      EnergyAustralia publishes no sandbox or test credentials. The CDR Mock Data Holder
