- aid: energyaustralia:energyaustralia-cdr-energy-consumer-data-api
  name: EnergyAustralia CDR Energy Consumer Data Sharing API
  description: >-
    The mandated, authenticated Consumer Data Right consumer data-sharing surface —
    energy accounts, invoices, billing, balances, concessions, payment schedules,
    electricity service points, interval usage and DER register data — implemented to
    the Consumer Data Standards CDR Energy API. EnergyAustralia is a live registered
    CDR energy data holder; the ACCC CDR Register returned its brand entry on
    2026-07-27 (dataHolderBrandId 1cc7833a-b834-ed11-a832-000d3a8830d6, ABN
    99086014968, lastUpdated 2026-07-01) with publicBaseUri
    https://authncdr.energyaustralia.com.au. That host is live behind Akamai and
    Cloudflare but is not anonymously browsable: every standards path probed
    (/.well-known/openid-configuration, /cds-au/v1/discovery/status,
    /cds-au/v1/energy/plans, /cds-au/v1/energy/accounts) returned HTTP 404, and the
    root 302-redirects to /admin/app. Access requires ACCC accreditation as a Data
    Recipient, mTLS client certificates issued through the CDR Register, an OAuth2 /
    OpenID Connect FAPI 1.0 authorisation with customer consent, and AEMO acting as
    secondary data holder for metering and DER data. There is no developer signup.
