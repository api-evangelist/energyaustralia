imageNote: >-
  The `image` property was removed in the 2026-07-27 enrichment round. It had been
  scaffolded to
  https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/groq.png — Groq's logo,
  not EnergyAustralia's. No correct icon exists yet
  (.../icons/energyaustralia.png returns HTTP 403) and the corporate site is behind
  Akamai bot management, so no logo asset could be fetched to backfill it. Shipping the
  wrong company's mark was judged worse than shipping none; re-run backfill-icons.py once
  a real asset is available.
