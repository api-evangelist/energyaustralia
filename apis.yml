modified: '2026-07-27'
enrichment:
  round: '2026-07-27'
  note: >-
    Round 2 enrichment. Contract discovery re-run against every host: no additional
    OpenAPI, no GraphQL, no MCP server, no AsyncAPI, no webhooks, no /llms.txt, no
    /.well-known document, no security.txt, no trust center, no first-party SDK, no CLI,
    no UI components, no sandbox and no Postman collection exist. All recorded as
    verified negatives. The artifacts added are derived from the two harvested Consumer
    Data Standards contracts and from the live public brand path.
