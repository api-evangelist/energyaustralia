name: EnergyAustralia
kind: company
description: >-
  EnergyAustralia is one of Australia's "big three" gentailers — a vertically
  integrated electricity and gas business owned by Hong Kong's CLP Group and headquartered
  in Melbourne, generating from Yallourn, Mount Piper and Hallett alongside wind assets
  and retailing to more than 1.7 million residential and business customers across
  Victoria, New South Wales, Queensland, South Australia and the ACT. It sits on both
  sides of the National Electricity Market value chain: a scheduled generator into
  the NEM, and a retailer of record holding the customer relationship, the billing
  account and the meter data. Its API posture is entirely a function of the Consumer
  Data Right rather than of any product strategy. EnergyAustralia is a designated and
  live CDR energy data holder — brand id 1cc7833a-b834-ed11-a832-000d3a8830d6 in the
  ACCC CDR Register, public base URI https://authncdr.energyaustralia.com.au — but the
  only anonymously reachable contract carrying its name is the Product Reference Data
  surface, and that is hosted by the Australian Energy Regulator's Energy Made Easy
  CDR gateway, not by EnergyAustralia. The company publishes no developer portal, no
  OpenAPI of its own, no open market or generation data, and no self-serve signup; its
  own gateway at api.energyaustralia.com.au (MuleSoft Anypoint) answers 403 to the
  public. Consumer usage, billing and DER data is real, standardised and live, but
  reachable only by an ACCC-accredited data recipient under consent. Open on plans,
  closed on everything else.
