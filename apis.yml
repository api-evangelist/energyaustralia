apis:
- aid: energyaustralia:energyaustralia-cdr-energy-plans-api
  name: EnergyAustralia CDR Energy Plans API
  description: >-
    Public, unauthenticated Consumer Data Right energy Product Reference Data for the
    EnergyAustralia brand, conforming to the Australian Consumer Data Standards energy
    schemas. Unlike CDR banking — where every bank self-hosts its own product endpoint —
    energy product data is served centrally by the Australian Energy Regulator's Energy
    Made Easy CDR gateway on a per-retailer path. Confirmed live on 2026-07-27: GET
    /energy/plans returned HTTP 200 with response header x-v 1 and meta.totalRecords of
    1122 published EnergyAustralia plans (265 of them GAS fuelType), and GET
    /energy/plans/{planId} returned HTTP 200 at x-v 3 for planId ENE831725MRE15@EME.
    No API key, no registration, no consent required.
