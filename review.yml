actions:
  openapiPaths:
    - openapi/energyaustralia-cds-energy-api-openapi.yml
    - openapi/energyaustralia-cds-common-api-openapi.yml
  apisYmlUpdated: true
  reason: >-
    Three APIs listed. Two are verified-live public contracts served for the
    EnergyAustralia brand on the AER's Energy Made Easy CDR gateway. The third is the
    mandated consumer data-sharing surface, listed because the ACCC CDR Register
    publishes EnergyAustralia's base URI and the Consumer Data Standards define the
    contract — but flagged throughout as accredited-only and NOT independently verified.
    No EnergyAustralia-authored specification, developer portal, or open market data
    exists to record.
