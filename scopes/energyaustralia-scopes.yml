note: >-
  Derived from the per-operation `x-scopes` extension in the Consumer Data Standards
  CDR Energy API 1.36.0 and CDR Common API 1.36.0. The CDS OpenAPI documents do NOT
  declare `components.securitySchemes` — authorisation is specified out-of-band in the
  CDR Information Security profile (FAPI 1.0 Advanced), and the resource-server scopes
  are carried per operation as `x-scopes`. `derive-oauth-scopes.py` therefore returns
  zero for this provider; this file was derived by reading `x-scopes` directly.
  EnergyAustralia is a live registered CDR energy data holder (ACCC CDR Register
  dataHolderBrandId 1cc7833a-b834-ed11-a832-000d3a8830d6), so these are the scopes an
  accredited Data Recipient requests against its publicBaseUri. The scope values are
  ecosystem-wide CDR values, identical for every energy data holder — EnergyAustralia
  publishes no proprietary scope reference.
authorization_model:
  profile: FAPI 1.0 Advanced (CDR Information Security profile)
  protocol: OAuth 2.0 + OpenID Connect
  consent: Per-consumer authorisation with an explicit CDR consent and sharing duration
  authorization_server: >-
    Published per data holder brand in the ACCC CDR Register. EnergyAustralia's
    publicBaseUri is https://authncdr.energyaustralia.com.au; its OIDC discovery
    document was NOT anonymously readable (HTTP 404 on
    /.well-known/openid-configuration, probed 2026-07-27), so authorizationUrl and
    tokenUrl could not be captured without ACCC accreditation.
  discovery_gated: true
